spring.application.name=kapinda-backend
server.port=8080

spring.jackson.default-property-inclusion=non_null

# Local startup automatically reads backend/.env or project .env.
# Keep credentials in .env; do not copy secrets into this file.
# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/delivery-app}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Comma-separated Firebase emails that are allowed to approve restaurants.
delivery.admin-emails=${DELIVERY_ADMIN_EMAILS:}
# Customer order-help number. An admin-saved support setting takes precedence.
delivery.support-phone=${DELIVERY_SUPPORT_PHONE:01280193490}
